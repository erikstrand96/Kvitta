apiVersion: v1
kind: Secret
metadata:
  name: kvitta-secret
  labels:
    app: kvitta
type: Opaque
# Security note: placeholder credentials for development / dry-run only.
# For real environments inject values via sealed-secrets, an external secret
# store, or a kustomize secretGenerator in an overlay. Never commit real secrets.
# Keep the password in BOTH keys identical.
stringData:
  POSTGRES_PASSWORD: "change-me-postgres-password"
  KvittaDbConnection: "Host=db-svc;Port=5432;Database=kvitta;Username=postgres;Password=change-me-postgres-password"
