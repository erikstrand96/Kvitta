apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deploy
  labels:
    app: kvitta-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kvitta-db
  template:
    metadata:
      labels:
        app: kvitta-db
    spec:
      containers:
        - name: kvitta-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kvitta-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: kvitta
            # Subdirectory avoids "lost+found" init failures on some volume types
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "kvitta"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "kvitta"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
