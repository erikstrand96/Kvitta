apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  labels:
    app: kvitta-db
spec:
  accessModes:
    - ReadWriteOnce
  # Uncomment and set if your cluster has no default StorageClass
  # (check with: kubectl get sc). e.g. local-path on k3s / Raspberry Pi.
  # storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
