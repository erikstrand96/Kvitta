apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
  labels:
    app: kvitta-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kvitta-api
  template:
    metadata:
      labels:
        app: kvitta-api
    spec:
      initContainers:
        # Block API startup until Postgres accepts connections
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h db-svc -p 5432 -U postgres; do echo "waiting for db"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: kvitta-api
          # TODO: pin to a specific version tag or digest and drop "Always"
          image: erikstrand/kvitta-arm64:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Use Development only for local work (e.g. via a kustomize overlay)
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            # .NET 8+. 8080 avoids needing to bind a privileged port as non-root
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: KvittaDbConnection
              valueFrom:
                secretKeyRef:
                  name: kvitta-secret
                  key: KvittaDbConnection
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # TCP probes since the app's health endpoint is unknown.
          # Switch to httpGet on /health if you add one.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
